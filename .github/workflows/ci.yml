name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: true

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore CuttingStock.slnx

      - name: Build solution
        run: dotnet build CuttingStock.slnx -c Release --no-restore

      - name: Run correctness tests
        run: dotnet test CuttingStock.slnx -c Release --nologo --no-build

      - name: Build benchmarks
        run: dotnet build CuttingStock.Benchmarks/CuttingStock.Benchmarks.csproj -c Release --no-restore
